<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitScope- Profile Viewer</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitScope</span>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <h1 class="title">Search GitHub Profile</h1>
      <p class="subtitle">Enter a username to explore their repositories and stats</p>
      <div class="search-bar">
        <span class="search-icon">@</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="e.g. torvalds"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="searchBtn" class="search-btn">Search</button>
      </div>
      <p id="errorMsg" class="error-msg hidden">User not found. Please check the username.</p>
    </section>

    <!-- Loading Spinner -->
    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <span>Fetching profile...</span>
    </div>

    <!-- Results Section -->
    <main id="results" class="results hidden">

      <!-- Profile Card -->
      <section class="profile-card">
        <div class="profile-left">
          <img id="avatar" class="avatar" src="" alt="Avatar" />
        </div>
        <div class="profile-right">
          <h2 id="profileName" class="profile-name"></h2>
          <p id="profileUsername" class="profile-username"></p>
          <p id="profileBio" class="profile-bio"></p>
          <div class="profile-meta">
            <span id="profileLocation" class="meta-item hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span id="locationText"></span>
            </span>
            <a id="profileBlog" class="meta-item hidden" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              <span id="blogText"></span>
            </a>
          </div>
          <div class="profile-stats">
            <div class="stat">
              <span id="statRepos" class="stat-value">0</span>
              <span class="stat-label">Repos</span>
            </div>
            <div class="stat">
              <span id="statFollowers" class="stat-value">0</span>
              <span class="stat-label">Followers</span>
            </div>
            <div class="stat">
              <span id="statFollowing" class="stat-value">0</span>
              <span class="stat-label">Following</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Language Stats -->
      <section class="section">
        <h3 class="section-title">Top Languages</h3>
        <div id="langStats" class="lang-stats"></div>
      </section>

      <!-- Repositories -->
      <section class="section">
        <h3 class="section-title">Repositories <span id="repoCount" class="repo-count"></span></h3>
        <div id="repoGrid" class="repo-grid"></div>
      </section>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
